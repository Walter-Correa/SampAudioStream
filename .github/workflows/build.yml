name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - "*"
      - "*/*"
      - "**"
  pull_request:
    branches:
      - "*"
      - "*/*"
      - "**"

jobs:
  build-windows-release:
    name: Build Windows (Win32)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
          submodules: recursive
          fetch-depth: 0

      - name: Clone SDK dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path deps | Out-Null
          $pins = @{}
          foreach ($line in Get-Content cmake/sdk-pins.txt) {
            if ($line -match '^([A-Z_]+)=(\S+)$') { $pins[$Matches[1]] = $Matches[2] }
          }
          if (-not (Test-Path "deps/open.mp-sdk/CMakeLists.txt")) {
            git init deps/open.mp-sdk
            git -C deps/open.mp-sdk remote add origin $pins.OMP_SDK_REPO
            git -C deps/open.mp-sdk fetch --depth 1 origin $pins.OMP_SDK_COMMIT
            git -C deps/open.mp-sdk checkout FETCH_HEAD
            git -C deps/open.mp-sdk submodule update --init --recursive --depth 1
          }
          if (-not (Test-Path "deps/samp-plugin-sdk/plugincommon.h")) {
            git init deps/samp-plugin-sdk
            git -C deps/samp-plugin-sdk remote add origin $pins.SAMP_SDK_REPO
            git -C deps/samp-plugin-sdk fetch --depth 1 origin $pins.SAMP_SDK_COMMIT
            git -C deps/samp-plugin-sdk checkout FETCH_HEAD
          }

      - name: Configure CMake (Win32)
        run: cmake -B build -A Win32 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run Unit Tests
        run: ctest --test-dir build -C Release -R core_tests --output-on-failure -V --timeout 300

      - name: Upload Windows Hang Diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-test-hang-diagnostics
          path: |
            build/Release/sampaudiostream_tests_hang.dmp
            build/Release/sampaudiostream_tests.exe
            build/Release/sampaudiostream_tests.pdb
          if-no-files-found: ignore

      - name: Prepare Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package/plugins | Out-Null
          New-Item -ItemType Directory -Force -Path package/components | Out-Null
          New-Item -ItemType Directory -Force -Path package/include | Out-Null
          New-Item -ItemType Directory -Force -Path package/filterscripts | Out-Null

          $dll = "build/Release/SampAudioStream.dll"
          if (-not (Test-Path $dll)) {
            throw "Expected binary $dll does not exist!"
          }

          Copy-Item $dll "package/plugins/SampAudioStream.dll" -Force
          Copy-Item $dll "package/components/SampAudioStream.dll" -Force

          if (Test-Path "SampAudioStream.inc") { Copy-Item "SampAudioStream.inc" "package/include/SampAudioStream.inc" -Force }
          if (Test-Path "FS_SampAudioStream_Demo.pwn") { Copy-Item "FS_SampAudioStream_Demo.pwn" "package/filterscripts/FS_SampAudioStream_Demo.pwn" -Force }
          if (Test-Path "FS_SampAudioStream_Demo.amx") { Copy-Item "FS_SampAudioStream_Demo.amx" "package/filterscripts/FS_SampAudioStream_Demo.amx" -Force }
          if (Test-Path "LICENSE") { Copy-Item "LICENSE" "package/LICENSE" -Force }

      - name: Verify Windows Static Runtime
        shell: pwsh
        run: |
          foreach ($file in @("package/plugins/SampAudioStream.dll", "package/components/SampAudioStream.dll")) {
            if (-not (Test-Path $file)) {
              throw "Expected binary $file does not exist!"
            }
            $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $file))
            $ascii = [System.Text.Encoding]::ASCII.GetString($bytes)
            if ($ascii -match "MSVCP\d+\.dll" -or $ascii -match "VCRUNTIME\d+\.dll") {
              throw "Verification failed: $file depends on dynamic MSVC runtime (MSVCP/VCRUNTIME)!"
            }
          }
          Write-Host "Windows static runtime verification passed: 0 MSVCP/VCRUNTIME dependencies."

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v7
        with:
          name: SampAudioStream-Windows
          path: package
          if-no-files-found: error

  build-linux-release:
    name: Build Linux (x86 32-bit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
          submodules: recursive
          fetch-depth: 0

      - name: Clone SDK dependencies
        run: |
          mkdir -p deps
          set -a; . cmake/sdk-pins.txt; set +a
          if [ ! -f "deps/open.mp-sdk/CMakeLists.txt" ]; then
            git init deps/open.mp-sdk
            git -C deps/open.mp-sdk remote add origin "$OMP_SDK_REPO"
            git -C deps/open.mp-sdk fetch --depth 1 origin "$OMP_SDK_COMMIT"
            git -C deps/open.mp-sdk checkout FETCH_HEAD
            git -C deps/open.mp-sdk submodule update --init --recursive --depth 1
          fi
          if [ ! -f "deps/samp-plugin-sdk/plugincommon.h" ]; then
            git init deps/samp-plugin-sdk
            git -C deps/samp-plugin-sdk remote add origin "$SAMP_SDK_REPO"
            git -C deps/samp-plugin-sdk fetch --depth 1 origin "$SAMP_SDK_COMMIT"
            git -C deps/samp-plugin-sdk checkout FETCH_HEAD
          fi

      - name: Build inside debian:bullseye container
        run: |
          docker run --rm \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -v "${PWD}:/workspace" \
            -w /workspace \
            debian:bullseye bash -c '
            set -e
            rm -f /etc/apt/sources.list.d/debian.sources
            printf "deb http://archive.debian.org/debian bullseye main\ndeb http://archive.debian.org/debian bullseye-updates main\ndeb http://archive.debian.org/debian-security bullseye-security main\n" > /etc/apt/sources.list
            dpkg --add-architecture i386
            apt-get -o Acquire::Check-Valid-Until=false update
            apt-get install -y --no-install-recommends ca-certificates curl git g++-multilib gcc-multilib make zip binutils file gdb libcurl4:i386
            curl -sSL https://github.com/Kitware/CMake/releases/download/v3.30.5/cmake-3.30.5-linux-x86_64.tar.gz -o /tmp/cmake.tar.gz
            echo "f747d9b23e1a252a8beafb4ed2bc2ddf78cff7f04a8e4de19f4ff88e9b51dc9d  /tmp/cmake.tar.gz" | sha256sum -c -
            tar --strip-components=1 -xz -C /usr/local -f /tmp/cmake.tar.gz
            rm -f /tmp/cmake.tar.gz
            git config --global --add safe.directory "*"
            cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=cmake/linux-x86.cmake
            cmake --build build --parallel
            set -o pipefail
            timeout -s INT --kill-after=30 300 gdb --return-child-result -q -batch \
              -ex "set pagination off" -ex "handle SIGPIPE nostop noprint pass" \
              -ex run -ex "thread apply all bt" -ex "info threads" \
              --args ./build/sampaudiostream_tests | tee /tmp/test.log
            grep -q "All core unit tests passed!" /tmp/test.log
            chown -R "${HOST_UID}:${HOST_GID}" /workspace/build
          '

      - name: Prepare Package
        run: |
          mkdir -p package/plugins package/components package/include package/filterscripts
          SO_FILE="build/SampAudioStream.so"
          if [ ! -f "$SO_FILE" ]; then
            echo "Error: $SO_FILE not found!"
            exit 1
          fi

          cp "$SO_FILE" "package/plugins/SampAudioStream.so"
          cp "$SO_FILE" "package/components/SampAudioStream.so"

          [ -f "SampAudioStream.inc" ] && cp "SampAudioStream.inc" "package/include/SampAudioStream.inc"
          [ -f "FS_SampAudioStream_Demo.pwn" ] && cp "FS_SampAudioStream_Demo.pwn" "package/filterscripts/FS_SampAudioStream_Demo.pwn"
          [ -f "FS_SampAudioStream_Demo.amx" ] && cp "FS_SampAudioStream_Demo.amx" "package/filterscripts/FS_SampAudioStream_Demo.amx"
          [ -f "LICENSE" ] && cp "LICENSE" "package/LICENSE"

      - name: Verify Linux Compatibility and Exports
        run: |
          set -e
          for so in package/plugins/SampAudioStream.so package/components/SampAudioStream.so; do
            if [ ! -f "$so" ]; then
              echo "Error: $so not found!"
              exit 1
            fi
            FILE_INFO=$(file "$so")
            echo "$FILE_INFO"
            if ! echo "$FILE_INFO" | grep -q "ELF 32-bit LSB shared object, Intel 80386"; then
              echo "Verification failed: $so is not 32-bit Intel 80386 ELF!"
              exit 1
            fi
            if objdump -T "$so" | grep -q "GLIBCXX_"; then
              echo "Verification failed: $so depends on external GLIBCXX_!"
              exit 1
            fi
            MAX_GLIBC=$(objdump -T "$so" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -Vu | tail -1)
            echo "Max required GLIBC for $so: ${MAX_GLIBC:-none}"
            if [ -n "$MAX_GLIBC" ] && [ "$(printf '%s\n2.31\n' "$MAX_GLIBC" | sort -V | tail -1)" != "2.31" ]; then
              echo "Verification failed: $so requires GLIBC_${MAX_GLIBC} > 2.31!"
              exit 1
            fi
            UNEXPECTED=$(nm -D --defined-only "$so" | awk '{print $3}' | grep -v -E "^(ComponentEntryPoint|Supports|Load|Unload|AmxLoad|AmxUnload|ProcessTick)$" || true)
            if [ -n "$UNEXPECTED" ]; then
              echo "Verification failed: $so exports unexpected symbols:"
              echo "$UNEXPECTED"
              exit 1
            fi
          done
          echo "Linux verification passed: 32-bit x86, glibc <= 2.31, static libstdc++, and strict symbol exports."

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v7
        with:
          name: SampAudioStream-Linux
          path: package
          if-no-files-found: error
